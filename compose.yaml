services:
  app:
    build: .
    init: true
    restart: unless-stopped
    env_file: backend/.env.production
    expose:
      - "8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      TRUST_PROXY: "1"
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to your public domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
